packages:
  - "commerce"
  - "packages/*"

# Build scripts run only by explicit decision. `true` means the package needs its
# postinstall because it compiles or downloads a platform-specific native binary.
allowBuilds:
  esbuild: true
  "@swc/core": true
  sharp: true
  # Native resolver used by the Next.js ESLint config; needs its platform binary.
  unrs-resolver: true
  # Anonymous usage telemetry. Deliberately not run.
  "@medusajs/telemetry": false
  # Optional native accelerator; msgpackr falls back to its JavaScript implementation.
  msgpackr-extract: false
  # Postinstall only regenerates bundled artifacts we do not use.
  protobufjs: false
